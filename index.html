<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#e74c3c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MandarinMaster" />
    <meta name="description" content="Belajar bahasa Mandarin dengan kamus, soal HSK, AI tutor, latihan menulis & audio" />
    <link rel="manifest" href="/mandarin-master/manifest.json" />
    <link rel="icon" href="/mandarin-master/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/mandarin-master/icon-192.svg" />
    <title>MandarinMaster - Belajar Bahasa Mandarin</title>
    <style>
      /* Prevent overscroll bounce on iOS */
      html, body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      /* Safe area padding */
      body {
        padding-top: env(safe-area-inset-top, 0px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/mandarin-master/sw.js').catch(() => {});
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
